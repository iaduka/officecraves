        // ─── Menu Data ───────────────────────────────────────────────

                    { id: 23, name: "Teh-O Peng", description: "Iced black tea" },

                    { id: 25, name: "Teh Tarik", description: "Pulled milk tea with frothy texture" },
                    { id: 26, name: "Teh Halia", description: "Ginger tea" },
                    { id: 27, name: "Teh Si", description: "Tea with evaporated milk (less sweet than regular teh)" },
                    { id: 28, name: "Teh Gao", description: "Strong tea" },

                ]
            }
        ];

        const STAFF_NAMES = ["Anthony", "Amir", "Biow Ee", "Diana", "Florian", "Frank", "Frankie", "Gerald", "Henry", "Ian", "Jimmy", "Kah Huat", "Pete", "Ricky", "Rudy", "Sai Lam", "William", "Yoke Fong"];

        // ─── LocalStorage Helpers ────────────────────────────────────
        // (kept as fallback, primary storage is now Supabase)
        function loadOrders() {
            try {
                const data = localStorage.getItem('officecraves_orders');
                return data ? JSON.parse(data) : [];
            } catch { return []; }
        }

        function saveOrdersLocal(orders) {
            localStorage.setItem('officecraves_orders', JSON.stringify(orders));
        }

        // ─── Supabase Helpers ────────────────────────────────────────
        async function fetchOrders() {
            const { data, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('created_at', { ascending: true });
            if (error) {
                console.error('Error fetching orders:', error);
                return loadOrders();
            }
            return data.map(row => ({
                id: row.id,
                staffName: row.staff_name,
                items: row.items,
                notes: row.notes || '',
                timestamp: row.created_at,
            }));
        }

        async function insertOrder(order) {
            const { error } = await supabaseClient.from('orders').insert({
                id: order.id,
                staff_name: order.staffName,
                items: order.items,
                notes: order.notes,
                created_at: order.timestamp,
            });
            if (error) console.error('Error inserting order:', error);
        }

        async function updateOrder(order) {
            const { error } = await supabaseClient.from('orders').update({
                staff_name: order.staffName,
                items: order.items,
                notes: order.notes,
            }).eq('id', order.id);
            if (error) console.error('Error updating order:', error);
        }

        async function deleteOrder(id) {
            const { error } = await supabaseClient.from('orders').delete().eq('id', id);
            if (error) console.error('Error deleting order:', error);
        }

        async function deleteAllOrders() {
            const { error } = await supabaseClient.from('orders').delete().neq('id', 0);
            if (error) console.error('Error deleting all orders:', error);
        }

        // ─── Components ──────────────────────────────────────────────

        function Header({ totalOrders, onReset }) {
            return (
                <header className="bg-white border-b border-gray-200 sticky top-0 z-30">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4">
                        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 bg-brand-600 rounded-lg flex items-center justify-center">
                                    <span className="text-white text-lg">🍴</span>
                                </div>
                                <h1 className="text-xl font-bold text-gray-900">OfficeCraves</h1>
                            </div>
                            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                                <div className="bg-brand-50 border border-brand-100 rounded-lg px-4 py-2">
                                    <div className="text-sm">
                                        <span className="text-gray-500">Orders today:</span>
                                        <span className="ml-1 font-semibold text-brand-700">{totalOrders}</span>
                                    </div>
                                </div>
                                <button
                                    onClick={onReset}
                                    className="text-sm px-3 py-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 transition-colors font-medium"
                                >
                                    Reset All
                                </button>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }

        function MenuItem({ item, onAdd }) {
            return (
                <div className="bg-white rounded-xl border border-gray-100 p-4 hover:shadow-md hover:border-brand-200 transition-all duration-200 flex flex-col justify-between">
                    <div>
                        <h4 className="font-semibold text-gray-900 text-sm mb-1">{item.name}</h4>
                        <p className="text-xs text-gray-500 leading-relaxed">{item.description}</p>
                    </div>
                    <button
                        onClick={() => onAdd(item)}
                        className="mt-3 w-full text-xs font-medium py-2 px-3 rounded-lg bg-brand-600 text-white hover:bg-brand-700 active:scale-[0.97] transition-all"
                    >
                        + Add to Order
                    </button>
                </div>
            );
        }

        function MenuSection({ category, icon, items, onAdd }) {
            return (
                <div className="mb-6">
                    <h3 className="text-sm font-semibold text-gray-700 mb-3 flex items-center gap-2">
                        <span>{icon}</span> {category}
                    </h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        {items.map(item => (
                            <MenuItem key={item.id} item={item} onAdd={onAdd} />
                        ))}
                    </div>
                </div>
            );
        }

        function OrderModal({ isOpen, onClose, onSubmit, editingOrder, selectedItem }) {
            const [staffName, setStaffName] = useState('');
            const [items, setItems] = useState([]);
            const [notes, setNotes] = useState('');

            useEffect(() => {
                if (editingOrder) {
                    setStaffName(editingOrder.staffName);
                    setItems(editingOrder.items.map(i => ({ ...i })));
                    setNotes(editingOrder.notes || '');
                } else if (selectedItem) {
                    setStaffName('');
                    setItems([{ ...selectedItem, quantity: 1 }]);
                    setNotes('');
                } else {
                    setStaffName('');
                    setItems([]);
                    setNotes('');
                }
            }, [editingOrder, selectedItem, isOpen]);

            const addItemToOrder = (menuItem) => {
                const existing = items.find(i => i.id === menuItem.id);
                if (existing) {
                    setItems(items.map(i => i.id === menuItem.id ? { ...i, quantity: i.quantity + 1 } : i));
                } else {
                    setItems([...items, { ...menuItem, quantity: 1 }]);
                }
            };

            const updateQuantity = (id, delta) => {
                setItems(items.map(i => {
                    if (i.id === id) {
                        const newQty = i.quantity + delta;
                        return newQty > 0 ? { ...i, quantity: newQty } : i;
                    }
                    return i;
                }).filter(i => i.quantity > 0));
            };

            const removeItem = (id) => {
                setItems(items.filter(i => i.id !== id));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!staffName.trim() || items.length === 0) return;
                onSubmit({
                    id: editingOrder ? editingOrder.id : Date.now(),
                    staffName: staffName.trim(),
                    items: items,
                    notes: notes.trim(),
                    timestamp: editingOrder ? editingOrder.timestamp : new Date().toISOString(),
                });
                onClose();
            };

            if (!isOpen) return null;

            return (
                <div className="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm" onClick={onClose}>
                    <div className="modal-content bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                            <h2 className="text-lg font-bold text-gray-900">{editingOrder ? 'Edit Order' : 'Place Order'}</h2>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
                        </div>
                        <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto p-6 space-y-5">
                            {/* Staff Name */}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1.5">Staff Name</label>
                                <input
                                    list="staff-names"
                                    value={staffName}
                                    onChange={e => setStaffName(e.target.value)}
                                    placeholder="Type or select your name"
                                    className="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                                    required
                                />
                                <datalist id="staff-names">
                                    {STAFF_NAMES.map(name => <option key={name} value={name} />)}
                                </datalist>
                            </div>

                            {/* Selected Items */}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1.5">Items</label>
                                {items.length === 0 && (
                                    <p className="text-xs text-gray-400 italic">No items added yet. Add from the menu below.</p>
                                )}
                                <div className="space-y-2">
                                    {items.map(item => (
                                        <div key={item.id} className="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2">
                                            <div className="flex-1 min-w-0">
                                                <span className="text-sm font-medium text-gray-800 truncate block">{item.name}</span>
                                            </div>
                                            <div className="flex items-center gap-2 ml-3">
                                                <button type="button" onClick={() => updateQuantity(item.id, -1)} className="w-6 h-6 rounded bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm flex items-center justify-center">−</button>
                                                <span className="text-sm font-semibold w-5 text-center">{item.quantity}</span>
                                                <button type="button" onClick={() => updateQuantity(item.id, 1)} className="w-6 h-6 rounded bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm flex items-center justify-center">+</button>
                                                <button type="button" onClick={() => removeItem(item.id)} className="ml-1 text-red-400 hover:text-red-600 text-sm">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                {/* Quick add from menu */}
                                <details className="mt-3">
                                    <summary className="text-xs text-brand-600 cursor-pointer hover:text-brand-700 font-medium">+ Add more items</summary>
                                    <div className="mt-2 max-h-40 overflow-y-auto border border-gray-100 rounded-lg p-2 space-y-1">
                                        {MENU.flatMap(cat => cat.items).map(menuItem => (
                                            <button
                                                key={menuItem.id}
                                                type="button"
                                                onClick={() => addItemToOrder(menuItem)}
                                                className="w-full text-left px-2 py-1.5 rounded hover:bg-brand-50 text-xs"
                                            >
                                                <span className="text-gray-700">{menuItem.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </details>
                            </div>

                            {/* Notes */}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1.5">Custom Notes</label>
                                <textarea
                                    value={notes}
                                    onChange={e => setNotes(e.target.value)}
                                    placeholder="e.g., No onions, Oat milk please..."
                                    rows={2}
                                    className="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent resize-none"
                                />
                            </div>

                            {/* Item count summary */}
                            {items.length > 0 && (
                                <div className="bg-brand-50 rounded-lg px-4 py-3 flex justify-between items-center">
                                    <span className="text-sm font-medium text-gray-700">Total Items</span>
                                    <span className="text-lg font-bold text-brand-700">{items.reduce((s, i) => s + i.quantity, 0)}</span>
                                </div>
                            )}
                        </form>
                        <div className="px-6 py-4 border-t border-gray-100 flex gap-3">
                            <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-lg border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">Cancel</button>
                            <button
                                type="submit"
                                onClick={handleSubmit}
                                disabled={!staffName.trim() || items.length === 0}
                                className="flex-1 py-2.5 rounded-lg bg-brand-600 text-white text-sm font-medium hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                            >
                                {editingOrder ? 'Update Order' : 'Confirm Order'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function OrderBoard({ orders, onEdit, onDelete }) {
            if (orders.length === 0) {
                return (
                    <div className="text-center py-12">
                        <div className="text-4xl mb-3">📋</div>
                        <p className="text-gray-400 text-sm">No orders yet today.</p>
                        <p className="text-gray-300 text-xs mt-1">Orders will appear here as they're placed.</p>
                    </div>
                );
            }

            return (
                <div className="space-y-3">
                    {orders.map(order => (
                        <div key={order.id} className="order-row bg-white border border-gray-100 rounded-xl p-4 hover:shadow-sm transition-shadow">
                            <div className="flex items-start justify-between mb-2">
                                <div>
                                    <span className="font-semibold text-gray-900 text-sm">{order.staffName}</span>
                                    <span className="text-xs text-gray-400 ml-2">
                                        {new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                    </span>
                                </div>
                                <div className="flex items-center gap-1">
                                    <button onClick={() => onEdit(order)} className="p-1.5 rounded-md hover:bg-gray-100 text-gray-400 hover:text-brand-600 transition-colors" title="Edit">
                                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                                    </button>
                                    <button onClick={() => onDelete(order.id)} className="p-1.5 rounded-md hover:bg-red-50 text-gray-400 hover:text-red-500 transition-colors" title="Delete">
                                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                    </button>
                                </div>
                            </div>
                            <div className="space-y-1">
                                {order.items.map((item, idx) => (
                                    <div key={idx} className="text-xs text-gray-600">
                                        {item.quantity}× {item.name}
                                    </div>
                                ))}
                            </div>
                            {order.notes && (
                                <p className="mt-2 text-xs text-gray-400 italic bg-gray-50 rounded px-2 py-1">💬 {order.notes}</p>
                            )}
                        </div>
                    ))}
                </div>
            );
        }

        function ConfirmDialog({ isOpen, message, onConfirm, onCancel }) {
            if (!isOpen) return null;
            return (
                <div className="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm" onClick={onCancel}>
                    <div className="modal-content bg-white rounded-xl shadow-xl p-6 max-w-sm w-full" onClick={e => e.stopPropagation()}>
                        <p className="text-sm text-gray-700 mb-5">{message}</p>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-2 rounded-lg border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50">Cancel</button>
                            <button onClick={onConfirm} className="flex-1 py-2 rounded-lg bg-red-600 text-white text-sm font-medium hover:bg-red-700">Confirm</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ─── App ─────────────────────────────────────────────────────
        function App() {
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(true);
            const [modalOpen, setModalOpen] = useState(false);
            const [editingOrder, setEditingOrder] = useState(null);
            const [selectedItem, setSelectedItem] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState({ open: false, message: '', onConfirm: null });

            // Load orders from Supabase on mount
            useEffect(() => {
                fetchOrders().then(data => {
                    setOrders(data);
                    saveOrdersLocal(data);
                    setLoading(false);
                });
            }, []);

            // Real-time subscription
            useEffect(() => {
                const channel = supabaseClient
                    .channel('orders-realtime')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (payload) => {
                        if (payload.eventType === 'INSERT') {
                            const row = payload.new;
                            const newOrder = {
                                id: row.id,
                                staffName: row.staff_name,
                                items: row.items,
                                notes: row.notes || '',
                                timestamp: row.created_at,
                            };
                            setOrders(prev => {
                                if (prev.find(o => o.id === newOrder.id)) return prev;
                                const updated = [...prev, newOrder];
                                saveOrdersLocal(updated);
                                return updated;
                            });
                        } else if (payload.eventType === 'UPDATE') {
                            const row = payload.new;
                            setOrders(prev => {
                                const updated = prev.map(o => o.id === row.id ? {
                                    id: row.id,
                                    staffName: row.staff_name,
                                    items: row.items,
                                    notes: row.notes || '',
                                    timestamp: row.created_at,
                                } : o);
                                saveOrdersLocal(updated);
                                return updated;
                            });
                        } else if (payload.eventType === 'DELETE') {
                            const oldRow = payload.old;
                            setOrders(prev => {
                                const updated = prev.filter(o => o.id !== oldRow.id);
                                saveOrdersLocal(updated);
                                return updated;
                            });
                        }
                    })
                    .subscribe();

                return () => { supabaseClient.removeChannel(channel); };
            }, []);

            const totalOrders = orders.length;

            const handleAddItem = (item) => {
                setEditingOrder(null);
                setSelectedItem(item);
                setModalOpen(true);
            };

            const handlePlaceOrder = () => {
                setEditingOrder(null);
                setSelectedItem(null);
                setModalOpen(true);
            };

            const handleSubmitOrder = async (order) => {
                if (editingOrder) {
                    setOrders(orders.map(o => o.id === order.id ? order : o));
                    await updateOrder(order);
                } else {
                    setOrders([...orders, order]);
                    await insertOrder(order);
                }
            };

            const handleEdit = (order) => {
                setSelectedItem(null);
                setEditingOrder(order);
                setModalOpen(true);
            };

            const handleDelete = (id) => {
                setConfirmDialog({
                    open: true,
                    message: 'Are you sure you want to remove this order?',
                    onConfirm: async () => {
                        setOrders(orders.filter(o => o.id !== id));
                        setConfirmDialog({ open: false, message: '', onConfirm: null });
                        await deleteOrder(id);
                    }
                });
            };

            const handleReset = () => {
                setConfirmDialog({
                    open: true,
                    message: "This will clear all orders. Are you sure?",
                    onConfirm: async () => {
                        setOrders([]);
                        setConfirmDialog({ open: false, message: '', onConfirm: null });
                        await deleteAllOrders();
                    }
                });
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <Header totalOrders={totalOrders} onReset={handleReset} />

                    {loading ? (
                        <div className="flex items-center justify-center py-20">
                            <div className="text-center">
                                <div className="text-3xl mb-3 animate-pulse">☕</div>
                                <p className="text-sm text-gray-400">Loading orders...</p>
                            </div>
                        </div>
                    ) : (
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
                        <div className="lg:grid lg:grid-cols-5 lg:gap-8">
                            {/* Menu Section */}
                            <div className="lg:col-span-3">
                                <div className="flex items-center justify-between mb-5">
                                    <h2 className="text-lg font-bold text-gray-900">Menu</h2>
                                    <button
                                        onClick={handlePlaceOrder}
                                        className="px-4 py-2 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 active:scale-[0.97] transition-all shadow-sm"
                                    >
                                        Place Your Order
                                    </button>
                                </div>
                                {MENU.map(section => (
                                    <MenuSection
                                        key={section.category}
                                        category={section.category}
                                        icon={section.icon}
                                        items={section.items}
                                        onAdd={handleAddItem}
                                    />
                                ))}
                            </div>

                            {/* Order Board */}
                            <div className="lg:col-span-2 mt-8 lg:mt-0">
                                <div className="sticky top-[85px]">
                                    <h2 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                                        <span>📋</span> Team's Order
                                        {orders.length > 0 && (
                                            <span className="text-xs bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full font-semibold">{orders.length}</span>
                                        )}
                                    </h2>
                                    <div className="bg-gray-50 border border-gray-100 rounded-2xl p-4 max-h-[calc(100vh-160px)] overflow-y-auto">
                                        <OrderBoard orders={orders} onEdit={handleEdit} onDelete={handleDelete} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                    )}

                    <OrderModal
                        isOpen={modalOpen}
                        onClose={() => { setModalOpen(false); setEditingOrder(null); setSelectedItem(null); }}
                        onSubmit={handleSubmitOrder}
                        editingOrder={editingOrder}
                        selectedItem={selectedItem}
                    />

                    <ConfirmDialog
                        isOpen={confirmDialog.open}
                        message={confirmDialog.message}
                        onConfirm={confirmDialog.onConfirm}
                        onCancel={() => setConfirmDialog({ open: false, message: '', onConfirm: null })}
                    />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
